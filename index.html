<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYROVERA | Crypto Staking Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- Navbar -->
    <nav class="border-b border-slate-800 p-6 flex justify-between items-center">
        <div class="text-2xl font-bold tracking-tighter text-blue-500">CYROVERA</div>
        <button id="menu-btn" class="md:hidden"><i data-lucide="menu"></i></button>
        <div id="nav-links" class="hidden md:flex gap-8 text-sm uppercase tracking-widest text-slate-400">
            <a href="#" class="hover:text-white">Calculator</a>
            <a href="#" class="hover:text-white" onclick="toggleModal()">Contact</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-6 mt-12">
        <header class="text-center mb-16">
            <h1 class="text-5xl font-bold mb-4">Staking Calculator</h1>
            <p class="text-slate-400 text-lg">Calculate your potential earnings with precision.</p>
        </header>

        <section class="bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-2xl">
            <div class="grid md:grid-cols-2 gap-8">
                <div>
                    <label class="block text-xs uppercase mb-2 text-slate-500">Amount Staked (USD)</label>
                    <input type="number" id="amount" value="1000" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs uppercase mb-2 text-slate-500">Annual Yield (%)</label>
                    <input type="number" id="yield" value="12" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <div class="mt-10 p-6 bg-blue-950/30 border border-blue-900 rounded-xl text-center">
                <p class="text-sm text-blue-400 uppercase mb-2">Estimated Annual Return</p>
                <div id="result" class="text-4xl font-bold text-white">$120.00</div>
            </div>
        </section>
    </main>

    <!-- Contact Modal -->
    <div id="modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4">
        <div class="bg-slate-900 p-8 rounded-2xl max-w-sm w-full border border-slate-700">
            <h2 class="text-xl font-bold mb-4">Get in Touch</h2>
            <input type="email" placeholder="Your email" class="w-full bg-slate-800 p-3 rounded-lg mb-4">
            <button onclick="toggleModal()" class="w-full bg-blue-600 py-3 rounded-lg font-bold">Send Message</button>
            <button onclick="toggleModal()" class="w-full mt-2 text-slate-500 text-sm">Close</button>
        </div>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Calculator Logic
        const amountInput = document.getElementById('amount');
        const yieldInput = document.getElementById('yield');
        const resultDisplay = document.getElementById('result');

        function calculate() {
            const amount = parseFloat(amountInput.value) || 0;
            const yld = parseFloat(yieldInput.value) || 0;
            const total = (amount * (yld / 100)).toFixed(2);
            resultDisplay.innerText = `$${total}`;
        }

        [amountInput, yieldInput].forEach(el => el.addEventListener('input', calculate));

        // Modal/Menu Logic
        function toggleModal() {
            document.getElementById('modal').classList.toggle('hidden');
            document.getElementById('modal').classList.toggle('flex');
        }

        document.getElementById('menu-btn').addEventListener('click', () => {
            document.getElementById('nav-links').classList.toggle('hidden');
        });
    </script>
</body>
</html>
